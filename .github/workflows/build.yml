name: LanMain PassportPlugin Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build JAR for LanMain
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4
      name: Checkout Code

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LanMain-PassportPlugin-JAR
        path: target/passport-plugin-*.jar
        retention-days: 30
